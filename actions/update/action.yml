name: Update to latest upstream versions
description: Check every package with a .nvchecker.toml against its upstream (ayaka ci nvcheck), rewrite pkgver/checksums for the outdated ones (ayaka src nvbump), commit, push and dispatch the build workflow. Needs root in a container with base-devel, git, sudo, jq, pacman-contrib, github-cli and ayaka on PATH; makepkg and updpkgsums refuse root, so the bumps run as a scratch user.

inputs:
  ref:
    description: Remote ref the update commit is pushed to.
    default: master
  build_workflow:
    description: Workflow file dispatched after pushing; a GITHUB_TOKEN push never fires on:push itself.
    default: build.yml
  github_token:
    description: Token for the GitHub API rate limit, the push and the workflow dispatch (needs contents and actions write).
    required: true

outputs:
  updated:
    description: Space-separated pkgbase@version list actually bumped; empty when everything is current.
    value: ${{ steps.bump.outputs.updated }}
  sha:
    description: SHA of the update commit; empty when nothing was outdated.
    value: ${{ steps.commit.outputs.sha }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        # nvcheck exits non-zero when anything is outdated; the rows decide
        # what happens, not the exit code.
        ayaka ci nvcheck --format json >nvcheck.jsonl || true
        cat nvcheck.jsonl
        jq -c 'select(.status == "OUTDATED")' nvcheck.jsonl >outdated.jsonl
        echo "count=$(wc -l <outdated.jsonl)" >>"$GITHUB_OUTPUT"

    - id: bump
      if: steps.check.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        # sudo resets PATH, so give the scratch user a fixed ayaka location.
        install -m 0755 "$(command -v ayaka)" /usr/local/bin/ayaka
        id builder >/dev/null 2>&1 || useradd -m builder
        chown -R builder: .
        updated=()
        # Owned packages get their PKGBUILD rewritten; AUR mirrors are advanced
        # to origin with src pull (one call per repo) and land as gitlink moves.
        while IFS= read -r row; do
          repo=$(jq -r .repo <<<"$row")
          base=$(jq -r .pkgbase <<<"$row")
          ver=$(jq -r .latest <<<"$row")
          echo "updating $repo/$base to $ver"
          sudo -u builder ayaka src nvbump "$repo" "$base" "$ver" --no-commit
          updated+=("$base@$ver")
        done < <(jq -c 'select(.method == "nvbump")' outdated.jsonl)
        for repo in $(jq -r 'select(.method == "pull") | .repo' outdated.jsonl | sort -u); do
          mapfile -t pkgs < <(jq -r --arg r "$repo" 'select(.method == "pull" and .repo == $r) | .pkgbase' outdated.jsonl)
          echo "pulling in $repo: ${pkgs[*]}"
          sudo -u builder ayaka src pull "$repo" "${pkgs[@]}"
          while IFS= read -r ver_row; do
            updated+=("$(jq -r .pkgbase <<<"$ver_row")@$(jq -r .latest <<<"$ver_row")")
          done < <(jq -c --arg r "$repo" 'select(.method == "pull" and .repo == $r)' outdated.jsonl)
        done
        echo "updated=${updated[*]}" >>"$GITHUB_OUTPUT"

    - id: commit
      if: steps.check.outputs.count != '0'
      shell: bash
      env:
        IN_REF: ${{ inputs.ref }}
        IN_UPDATED: ${{ steps.bump.outputs.updated }}
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -u .
        git commit -m "chore: update $IN_UPDATED"
        git push origin "HEAD:$IN_REF"
        echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

    - if: steps.check.outputs.count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        IN_WORKFLOW: ${{ inputs.build_workflow }}
        IN_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        gh workflow run "$IN_WORKFLOW" --ref "$IN_REF"
